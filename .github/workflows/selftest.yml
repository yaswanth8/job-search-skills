name: self-test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Back-test, template and version checks
        run: python3 tools/build.py --check
      - name: Browser snippets parse
        run: for f in skills/us-job-search-automation/js/*.js; do node --check "$f"; done
      - name: Update ladder parses
        run: bash -n skills/us-job-search-automation/bootstrap.sh
